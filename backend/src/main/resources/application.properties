spring.application.name=mplads-sentinel-backend
server.port=8080

# ===== DataSource =====
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mplads_sentinel}
spring.datasource.username=${POSTGRES_USER:sentinel_user}
spring.datasource.password=${POSTGRES_PASSWORD:SentinelDB@2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:mplads-sentinel-jwt-secret-change-in-production-min-256-bits}
app.jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# ===== ML Service =====
app.ml.service-url=${ML_SERVICE_URL:http://localhost:8000}

# ===== Application =====
app.mode=${APP_MODE:demo}
app.name=MPLADS Sentinel
app.version=1.0.0

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===== Logging =====
logging.level.gov.mospi.sentinel=INFO
logging.level.org.springframework.security=WARN

ml.service.url=http://localhost:8001
