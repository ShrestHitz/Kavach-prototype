version: '3.9'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mplads_sentinel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mplads_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SentinelDB@2026!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-mplads_sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment when ready to run all services via Docker
